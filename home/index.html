<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>私人云盘</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>

<div id="login" class="card login-box">
  <div class="title">登录</div>
  <input id="user" placeholder="用户名">
  <input id="pass" type="password" placeholder="密码">
  <button onclick="login()">登录</button>
  <button onclick="showRegister()">去注册</button>
</div>

<div id="register" class="card login-box" style="display:none;">
  <div class="title">注册</div>
  <input id="reg_user" placeholder="用户名">
  <input id="reg_pass" type="password" placeholder="密码">
  <button onclick="register()">注册</button>
  <button onclick="showLogin()">返回登录</button>
</div>

<div id="main" style="display:none;">
  <button onclick="logout()">退出登录</button>
  <div class="card">
    <div class="title">文件上传</div>
    <div id="uploadBox">点击或拖拽上传</div>
    <input type="file" id="file-input" multiple>
  </div>
  <div id="file-list"></div>
</div>

<div id="confirmModal" style="display:none;">
  <p>确定删除？</p>
  <button onclick="closeModal()">取消</button>
  <button onclick="doDelete()">确定</button>
</div>

<script src="js/config.js"></script>
<script src="js/db.js"></script>
<script src="js/ui.js"></script>
<script src="js/main.js"></script>

</body>
</html>
